<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>NEGRI TECH - Samuel Ibarra</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

    <div id="login-screen" class="login-container">
        <div class="login-box">
            <h2 style="color: #1e293b;">🚀 NEGRI TECHMX</h2>
            <p style="color: #64748b; font-size: 0.9rem;">Ingresa tus credenciales</p>
            <input type="text" id="login-user" placeholder="Usuario (admin/cajero)">
            <input type="password" id="login-pass" placeholder="Contraseña">
            <button onclick="iniciarSesion()">ACCEDER</button>
        </div>
    </div>

    <div id="app-container" style="display: none; width: 100%;">
        <aside class="sidebar">
            <button onclick="cerrarSesion()" class="btn-logout">🚪 Cerrar Sesión</button>
            <h3>MENU</h3>
            <nav>
                <button onclick="showTab('vender')">🛒 Punto de Venta</button>
                <button onclick="showTab('inventario'); actualizar();">📦 Inventario</button>
                <button onclick="showTab('proveedores'); cargarProveedores();">🏢 Proveedores</button>
                <button onclick="showTab('historial'); cargarHistorial();">📜 Historial</button>
                <button id="btn-sat" onclick="showTab('sat')" style="display:none; color: #10b981;">🧾 Módulo SAT</button>
            </nav>
        </aside>

        <main class="content">
            <section id="tab-vender" class="tab-pane active">
                <header style="margin-bottom: 30px;">
                    <h1 style="margin:0;">Punto de Venta</h1>
                    <p style="color:var(--text-muted);">Gestiona tus ventas diarias</p>
                    <select id="sel-cliente" style="margin-top:10px; padding:8px; border-radius:5px; border:1px solid #ddd;"></select>
                </header>

                <div class="pos-layout">
                    <div id="grid-productos" class="grid-productos"></div>
                    <div class="cart-panel">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                            <h3 style="margin:0;">Carrito</h3>
                            <button onclick="vaciarCarrito()" class="btn-clear">Vaciar</button>
                        </div>
                        <div id="lista-carrito"></div>
                        <div style="margin-top: 20px; border-top: 2px dashed #eee; padding-top: 15px;">
                            <div style="display:flex; justify-content:space-between;">
                                <span style="font-weight:bold; font-size:1.2rem;">Total:</span>
                                <span id="total-txt" style="font-weight:bold; font-size:1.2rem; color:var(--primary);">$0.00</span>
                            </div>
                        </div>
                        <button class="btn-pay" onclick="procesarPago()">COBRAR E IMPRIMIR</button>
                    </div>
                </div>
            </section>

            <section id="tab-inventario" class="tab-pane">
                <h2>📦 Inventario de Productos</h2>
                <div class="form-box">
                    <input type="number" id="p-cod" placeholder="Código">
                    <input type="text" id="p-nom" placeholder="Producto">
                    <input type="number" id="p-pre" placeholder="Precio">
                    <input type="number" id="p-stock" placeholder="Stock Inicial">
                    <button onclick="guardarProducto()" style="background:var(--accent); color:white; border:none; padding:10px 20px; border-radius:5px; cursor:pointer;">+ Agregar</button>
                </div>
                <table class="main-table"><thead id="th-inv"><tr><th>Código</th><th>Nombre</th><th>Precio</th><th>Stock</th></tr></thead><tbody id="tabla-prod"></tbody></table>
            </section>

            <section id="tab-proveedores" class="tab-pane">
                <h2>🏢 Catálogo de Proveedores</h2>
                <div class="form-box">
                    <input type="text" id="pr-nom" placeholder="Empresa">
                    <input type="text" id="pr-rfc" placeholder="RFC">
                    <input type="text" id="pr-tel" placeholder="Teléfono">
                    <button onclick="guardarProveedor()" style="background:var(--primary); color:white; border:none; padding:10px 20px; border-radius:5px; cursor:pointer;">Registrar</button>
                </div>
                <table class="main-table"><thead><tr><th>ID</th><th>Empresa</th><th>RFC</th><th>Teléfono</th></tr></thead><tbody id="tabla-prov"></tbody></table>
            </section>

            <section id="tab-historial" class="tab-pane">
                <h2>📜 Historial de Ventas</h2>
                <table class="main-table"><thead><tr><th>Folio</th><th>Cliente</th><th>Total</th><th>Fecha</th><th>Detalles</th></tr></thead><tbody id="tabla-his"></tbody></table>
            </section>

            <section id="tab-sat" class="tab-pane">
                <h2>🧾 Facturación CFDI 4.0</h2>
                <div class="form-box" style="max-width: 400px;">
                    <input type="number" id="sat-folio" placeholder="Ingresa folio de venta">
                    <button onclick="generarFacturaSAT()" style="background:#10b981; color:white; border:none; padding:10px; border-radius:5px; cursor:pointer;">Generar PDF SAT</button>
                </div>
            </section>
        </main>
    </div>

    <div id="modal-detalle" class="modal"><div class="modal-content">
        <h2 id="det-folio" style="margin-top:0;"></h2>
        <p id="det-cliente" style="color:var(--text-muted);"></p>
        <hr>
        <div id="det-items" style="margin:20px 0;"></div>
        <h3 id="det-total" style="text-align:right; color:var(--primary);"></h3>
        <button onclick="cerrarModal()" style="width:100%; padding:10px; border:none; border-radius:8px; cursor:pointer;">Cerrar</button>
    </div></div>

    <script src="script.js"></script>
</body>
</html>
